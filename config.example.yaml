# =============================================================================
# Bedrock Ops Lens — customer configuration.
#
# Copy this file to `config.yaml` and edit. The deploy script (deploy.sh),
# the multi-account pipeline bootstrap (./setup-pipeline.sh), and the
# ingesters all read from this single file so there's one place to
# change a region or add an account.
#
# Any value here can be overridden at runtime via the matching env var (the
# env var name appears in [BRACKETS] next to each setting below).
# =============================================================================

# -----------------------------------------------------------------------------
# Deploy region — the SINGLE region where dashboard infrastructure lives:
#   Aurora Postgres, Fargate task, ALB, CloudFront origin, S3 invocation-logs
#   bucket, ECR repository, Cognito User Pool. CloudFront itself is global.
#
# Has nothing to do with which regions the INGESTER reads metrics from
# (see `monitored_regions` below — that's typically multi-region).
# -----------------------------------------------------------------------------
deploy_region: us-east-1                                  # [DEPLOY_REGION]

# -----------------------------------------------------------------------------
# Monitored accounts — which AWS accounts the ingester pulls Bedrock data
# from. The default is `single`: only the deployment account.
# Role deployment is separate from account discovery. Use the account owners'
# IAM workflow or setup-pipeline.sh; changing this mode does not create roles.
#
# Other modes are opt-in:
#
#   discover-org   Use AWS Organizations to enumerate every
#                  ACTIVE account. Requires the central account to be the
#                  management account or a delegated administrator for
#                  Organizations.
#
#   discover-ou    Only the accounts under one or more OUs (child OUs
#                  included), resolved on every run with
#                  organizations:ListAccountsForParent. Set by
#                  setup-pipeline.sh --scope ou; the OU IDs live in `ou_ids`
#                  / MONITORED_OU_IDS. A membership lookup failure fails the
#                  run instead of silently changing the scope.
#
#   explicit       A fixed list of account IDs. Useful when you only want
#                  to monitor a subset of your org, or you don't have an
#                  organization at all (each account must have the
#                  BedrockOpsLensReader role deployed). Use
#                  setup-pipeline.sh --scope accounts --accounts ID,ID
#                  --skip-rollout when account owners manage those roles.
#                  Without --skip-rollout, setup uses self-managed StackSets.
#                  See docs/manual-multi-account-setup.md.
#
#   single         Just the central account (where the dashboard runs).
#                  Simplest single-account deployment, no cross-account
#                  roles needed.
# For a Lambda deployment that must not use Organizations, deploy with
# ENABLE_ORGANIZATIONS_DISCOVERY=false before configuring the explicit list.
# Lambda environment values take precedence over this file.
# -----------------------------------------------------------------------------
monitored_accounts:
  mode: single                                            # [MONITORED_ACCOUNTS_MODE]
  # Used only when mode == "explicit":
  ids: []
    # - "111111111111"
    # - "222222222222"
  # Used only when mode == "discover-ou":                  # [MONITORED_OU_IDS]
  ou_ids: []
    # - "ou-xxxx-yyyyyyyy"

# -----------------------------------------------------------------------------
# Optional: account names for accountIds, shown across the dashboard as
# "name (123456789012)". Highest-precedence source — overrides names from
# AWS Organizations and the Account API. Useful when you're not in an org,
# or when you want labels different from the org account names. Names for
# unlisted accounts are auto-resolved (org ListAccounts in discover-org mode,
# else account:GetAccountInformation via the reader role) when permissions
# allow; otherwise the bare ID is shown.
# -----------------------------------------------------------------------------
account_names: {}
  # "111111111111": "payments-prod"
  # "222222222222": "data-science-sandbox"

# -----------------------------------------------------------------------------
# Monitored regions — which AWS regions the ingester scrapes per-account.
# Three named presets plus an escape hatch:
#
#   us-major     us-east-1, us-east-2, us-west-2
#                3 regions. Fastest first-time scrape. Good when all your
#                Bedrock traffic is in the US.
#
#   us-eu-apac   us-east-1, us-east-2, us-west-2, eu-west-1, eu-west-2,
#                eu-central-1, ap-southeast-1, ap-northeast-1
#                8 regions. Covers every region where Anthropic Claude
#                models are GA today. Sensible default for most fleets.
#
#   all          Live-discover every region currently enabled in the
#                account (account:ListRegions) and filter to the ones
#                where Bedrock is reachable. Most thorough; slowest.
#
#   explicit     Use the `regions` list below verbatim.
# -----------------------------------------------------------------------------
monitored_regions:
  preset: us-eu-apac                                      # [MONITORED_REGIONS_PRESET]
  # Used only when preset == "explicit":
  regions: []

# -----------------------------------------------------------------------------
# Bedrock model invocation logging — required to populate the per-tag
# attribution tables (f_daily_tagged, dim_tags). When enabled, each monitored
# account is configured to deliver invocation logs to the central S3 bucket
# created by deploy.sh.
#
# Reversal: aws bedrock delete-model-invocation-logging-configuration --region $REGION
# -----------------------------------------------------------------------------
invocation_logging:
  enabled: true                                           # [INVOCATION_LOGGING_ENABLED]
  text_data:      true                                    # [INVOCATION_LOG_TEXT]
  image_data:     false                                   # [INVOCATION_LOG_IMAGE]
  embedding_data: false                                   # [INVOCATION_LOG_EMBEDDING]
  video_data:     false                                   # [INVOCATION_LOG_VIDEO]

# -----------------------------------------------------------------------------
# Bedrock model used for Ops Review LLM synthesis. MUST be a CRIS-prefixed
# inference profile ID (us. / eu. / global.) — bare on-demand IDs are
# rejected by Bedrock for Claude 4.x.
# -----------------------------------------------------------------------------
ops_review:
  bedrock_region:   us-east-1                             # [BEDROCK_REGION]
  bedrock_model_id: us.anthropic.claude-opus-5  # [BEDROCK_MODEL_ID]

# -----------------------------------------------------------------------------
# IAM — cross-account reader role.
# For Lambda deployments, set BEDROCK_OPS_LENS_ROLE_NAME when running deploy.sh
# to configure the central ReaderRoleName parameter, IAM permission, and runtime
# together. setup-pipeline.sh reads that parameter. Changing this file alone
# does not grant permission to assume a differently named target role.
# -----------------------------------------------------------------------------
iam:
  reader_role_name: BedrockOpsLensReader                  # [BEDROCK_OPS_LENS_ROLE_NAME]
  external_id: ""                                         # [BEDROCK_OPS_LENS_EXTERNAL_ID]

# -----------------------------------------------------------------------------
# Existing network and IAM roles (optional).
#
# Leave this section commented out and deploy.sh asks on the first deployment
# whether to create the network and roles or use existing ones, then writes your
# answers here. Uncomment and fill it in to deploy non-interactively.
#
# Only an existing network's VPC and subnet IDs are required. Optional blanks
# create that resource on first deployment and preserve it on updates. Use
# `new` explicitly to request a generated resource, or an ID/ARN to reuse one.
# The network choice is fixed for the stack's life; role ARNs may change.
# Set `waf: none` to create no WAF resources.
#
# infra/examples/existing-network.yaml shows what the network must provide and
# infra/examples/existing-execution-roles.yaml lists the permissions each role
# needs. Supplied resources are validated against the account before anything is
# created. See docs/existing-resources.md.
# -----------------------------------------------------------------------------
# existing_resources:
#   network:                                  # or `network: new`
#     vpc_id: vpc-0123456789abcdef0
#     private_subnet_ids: [subnet-0123456789abcdef0, subnet-0fedcba9876543210]
#     lambda_security_group_id: new           # sg-… or new
#     db_security_group_id: new               # sg-… (must admit TCP 5432 from the Lambda group) or new
#     cache_security_group_id: new            # sg-… (must admit TCP 11211 from the Lambda group) or new
#   roles:                                    # or `roles: new`
#     backend: arn:aws:iam::123456789012:role/lens-backend
#     ingester: arn:aws:iam::123456789012:role/lens-ingester
#     schema_init: arn:aws:iam::123456789012:role/lens-schema-init
#     prewarm: new
#     pre_signup: new
#     post_confirm: new
#     edge: arn:aws:iam::123456789012:role/lens-edge   # must also trust edgelambda.amazonaws.com
#   cloudformation_service_role_arn: none     # or an IAM role ARN trusting cloudformation.amazonaws.com
#   waf: none                                 # new (AWS WAF web ACL in front of CloudFront), none, or an
#                                             # existing CLOUDFRONT-scope web ACL ARN (us-east-1)
